[tool.poetry]
name = "gemini-classifier"
version = "0.1.0"
description = "Taxonomy classification of eLibrary content (EN + ZH) with Gemini + context caching"
authors = ["Mark Chen <mark@example.com>"]
readme = "README.md"
packages = [{include = "classifier"}]

[tool.poetry.dependencies]
python = "^3.12"
google-genai = "^1.0.0"
pydantic = "^2.11.9"
loguru = "^0.7.2"
tqdm = "^4.66.0"
orjson = "^3.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
classify = "classifier.run:main"
